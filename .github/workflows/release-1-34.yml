name: Mise en ligne de la 1.34 (planifiée)

on:
  schedule:
    # 20 novembre, 07:00 UTC = 08:00 à Paris (heure d'hiver)
    - cron: '0 7 20 11 *'
  workflow_dispatch: {}   # permet aussi de le lancer à la main (onglet Actions)

permissions:
  contents: write
  pages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la date (2026 uniquement)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%Y)" != "2026" ]; then echo "Pas en 2026, rien à faire."; exit 1; fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fusionner v1.34 dans main
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin v1.34
          git merge origin/v1.34 -X theirs --no-edit -m "Mise en ligne de la 1.34.0.0"
          git push origin main

      - name: Relancer la publication GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
