<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#14182b;--mu:#5d6482;--ac:#5b3df5;--ok:#1a9d5c;--bd:#dfe2f0;--hi:#ece8ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1020;--card:#171b33;--tx:#eef0ff;--mu:#9aa1c8;--ac:#8d77ff;--ok:#3ddc97;--bd:#2a3059;--hi:#262b57;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1020;--card:#171b33;--tx:#eef0ff;--mu:#9aa1c8;--ac:#8d77ff;--ok:#3ddc97;--bd:#2a3059;--hi:#262b57;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:760px;margin:0 auto;padding:12px}
h1{font-size:19px;margin:4px 0 10px}h2{font-size:15px;margin:14px 0 6px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px}
button.p{background:var(--ac);color:var(--onac,#fff);border-color:var(--ac)}button.on{border-color:var(--ac);background:var(--hi)}
nav button{flex:1}
.row{box-sizing:border-box;display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 8px;border-radius:8px;border:1px solid transparent;background:none}
.row.st{background:var(--hi)}.row.sel{border-color:var(--ac)}
.pos{font-size:11px;font-weight:700;width:34px;color:var(--ac)}.nm{flex:1}.mu{color:var(--mu);font-size:12px}
.bar{width:44px;height:6px;background:var(--bd);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.score{font-size:34px;font-weight:800;text-align:center;margin:4px 0}
.log{max-height:230px;overflow:auto;font-size:13px}.log div{padding:2px 0;border-bottom:1px solid var(--bd)}.log b{color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 4px;text-align:center}td:nth-child(2),th:nth-child(2){text-align:left}tr.me{background:var(--hi);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.d{transition:transform 2.6s ease-in-out}.spin{width:36px;height:36px;border:4px solid #fff4;border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.hp{position:relative;display:inline-block;width:16px;height:16px;line-height:16px;text-align:center;border-radius:50%;background:var(--ac);color:var(--onac,#fff);font:700 11px/16px system-ui;cursor:help;margin-left:5px;text-transform:none;letter-spacing:0;vertical-align:middle}.tip{display:none;position:absolute;z-index:30;left:50%;transform:translateX(-50%);top:20px;width:min(270px,72vw);background:var(--card);color:var(--tx);border:1px solid var(--ac);border-radius:8px;padding:8px;font:400 12px/1.4 system-ui;text-align:left;white-space:normal;box-shadow:0 4px 14px #0004}.hp:hover .tip,.hp:focus .tip{display:block}.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}.pc{display:block;text-align:center;padding:4px 2px 6px;border-radius:10px;border:1px solid var(--bd);background:var(--card);cursor:pointer;min-width:0;width:100%}.pc .o{font-size:20px;font-weight:800;line-height:1.1}.pc .ps{font-size:10px;font-weight:700}.pc .pn{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pc .mu{font-size:10px}.pc .bar{width:70%;margin:3px auto}.pc.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}.pc.bad{background:#d334}.pg.l{display:block}.row.bad{background:#d334}#app:has(.sh){max-width:none;padding:0}.sh{display:flex;min-height:100vh}.sb{width:230px;flex:none;background:var(--sb,var(--card));border-right:1px solid var(--bd);padding:6px 0 50px;position:sticky;top:0;height:100vh;overflow:auto;z-index:40}.mn{flex:1;min-width:0;padding:10px 14px 60px}.mn>h1,.mn>nav{display:none}.si{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;border-left:3px solid tran function natSync(t,fresh){const pl=t.name;if(natPool(pl).length<12)natFill(pl);const pool=natPool(pl),by=new Map(pool.map(p=>[p.n,p]));if(fresh)t.ros=null;let ros=(t.ros||[]).filter(n=>by.has(n));if(ros.length<12)pool.slice().sort((a,b)=>b.o-a.o).forEach(p=>{if(ros.length<14&&!ros.includes(p.n))ros.push(p.n)});t.ros=ros;const cur=t.lun||(t.sq||[]).filter(Boolean).length&&(t.lu||[]).map(i=>t.sq[i]?t.sq[i].n:null)||[];delete t.lun;t.sq=ros.map(n=>by.get(n));t.lu=cur.map(n=>n?t.sq.findIndex(p=>p.n==n):-1);if(t.lu.length<7||t.lu.includes(-1)||new Set(t.lu).size<t.lu.length)autoLU(t)}

function pitch(M){const P=[];M.t.forEach((t,sd)=>{const bx=M.bx??.5,by=M.by??.5,ps=t.lu.map((_,k)=>pos(t,k,sd)),nr=ps.map((q,k)=>[k,(q[0]-bx)**2+(q[1]-by)**2]).filter(z=>z[0]).sort((a,b)=>a[1]-b[1]).slice(0,2).map(z=>z[0]);ps.forEach((q,k)=>{let[x,y]=q;if(nr.includes(k)){x+=(bx-x)*.5;y+=(by-y)*.5}else if(k)y+=(by-y)*.12;P.push([x*105,y*68])})});P.push([(M.bx??.5)*105,(M.by??.5)*68]);const pp=V.pp&&V.pp.length==P.length?V.pp:P,n=M.t[0].lu.length;V.nx=P;V.pp=P;return field(P.map((q,i)=>{const o=pp[i],b=i==P.length-1;return`<g class="d" id="d${i}" style="transform:translate(${o[0]}px,${o[1]}px)"><circle r="${b?2:3}" fill="${b?(M.at==1?'#e8743b':'var(--ac)'):i<n?'var(--ac)':'#e8743b'}" stroke="${b?'#fff':'#000'}" stroke-opacity="${b?1:.4}" stroke-width="${b?.8:.3}"/></g>`}).join(''))}
function anim(){setTimeout(()=>(V.nx||[]).forEach((q,i)=>{const e=$('d'+i);if(e)e.style.transform=`translate(${q[0]}px,${q[1]}px)`}),40)}
function tacView(){const t=me(),s=slots(t.form),dots=t.lu.map((li,k)=>{const[x,y]=pos(t,k,0),p=t.sq[li];return`<g onclick="pick(${li})" style="cursor:pointer"><circle cx="${x*105}" cy="${y*68}" r="3.4" fill="${p.p!=s[k]?'#d33':'var(--ac)'}" stroke="${V.sel===li?'#fff':'none'}" stroke-width="1"/><text x="${x*105}" y="${y*68+1}" font-size="3" fill="#fff" text-anchor="middle">${p.o}</text><text x="${x*105}" y="${y*68+7}" font-size="2.6" fill="#fff" text-anchor="middle">${p.n.split(' ').map((w,i,a)=>i<a.length-1?w[0]+'.':w).join(' ')}</text></g>`}).join('');
return`<div class="card"><div class="ctl"><label>Formation <select onchange="me().form=this.value;autoLU(me());save();render()">${Object.keys(FORM).map(f=>`<option ${f==t.form?'selected':''}>${f}</option>`).join('')}</select></label><label>Mentalité <select onchange="me().m=+this.value;save()">${MENT.map((m,i)=>`<option value="${i}" ${i==t.m?'selected':''}>${m}</option>`).join('')}</select></label><label>Pressing <select onchange="me().pr=+this.value;save()">${['Bas','Moyen','Haut'].map((m,i)=>`<option value="${i}" ${(t.pr??1)==i?'selected':''}>${m}</option>`).join('')}</select></label><button onclick="autoLU(me());render()">Auto</button></div></div><div class="card">${foSel()}</div>${ordView()}<div class="card">${field(dots)}<div class="mu">Touchez un joueur du terrain puis un autre (ou un remplaçant) pour échanger. Rouge = hors de son poste. Pressing haut : plus de milieu mais plus de fatigue.</div></div>`+squad()}
const gate=()=>{const f=Math.max(.02,Math.min(1,.35+S.conf/150-(S.tk-10)*.035-(S.st-1)*.06));return Math.round(2000*S.st*f*S.tk/100)};
function upS(){const c=S.st*1500;if(S.st<5&&S.cash>=c){tx('Stade',-c);S.st++;mail('Stade agrandi','Votre stade passe au niveau '+S.st+' : '+2000*S.st+' places.');save();render()}}
function fixLU(t){const s=slots(t.form);let n=0;t.lu.forEach((li,k)=>{if(!t.sq[li].inj)return;let b=-1,bs=-1;t.sq.forEach((x,i)=>{if(!t.lu.includes(i)&&!x.inj){const v=x.o*(x.p==s[k]?1:.75);if(v>bs){bs=v;b=i}}});if(b>=0){t.lu[k]=b;n++}});if(n)mail('Remplacements automatiques',n+' joueur(s) blessé(s) ont été remplacés dans votre composition.')}

« à traiter » (messages qui attendent une réponse). Utilisez la recherche et les flèches pour parcourir.',orig:'Fluide (Fl) = puissance du pouvoir spécial du joueur, liée à sa planète d’origine. Endurance = capacité physique à encaisser les matchs (attribut). Énergie = fraîcheur du moment (barre). Compatibilité = à quel point un joueur s’accorde à un Fluide : 100 % pour celui de son origine, moins pour les autres, et d’autant plus difficile que l’équipe est forte. En changeant d’équipe, il peut rejeter le nouveau Fluide : léger malaise (🤢) quelques matchs si la compatibilité est d’au moins 30 %. En dessous de 30 %, le rejet devient sévère et progressif : le joueur peut être incapable de jouer plusieurs matchs, jusqu’à une saison entière vers 5 %.',chc:'Vos crédits : l’argent du club. Gagnés à chaque match (droits TV, billetterie, primes, sponsors, boutique), dépensés en salaires, transferts, staff et travaux. Détail dans Finances.',chf:'Confiance du conseil d’administration (0 à 100 %). Elle monte avec les victoires et les objectifs réussis, baisse avec les défaites et les objectifs manqués. Très basse, elle mène au licenciement. Détail dans Manager.',chd:'Date du jeu. Les matchs ont lieu environ une fois par semaine : entre deux, avancez jour par jour.',go:'Fait avancer le jeu jusqu’au prochain événement : le jour du match il devient « Jouer le match », sinon il avance les jours et s’arrête si une offre arrive.',w_mail:'Vos 6 derniers messages. Touchez-en un pour le lire dans la boîte de réception.',w_club:'Le prochain match du championnat avec sa date, ou votre joueur le plus fort.',w_table:'Extrait du classement autour de votre club. Le bouton › ouvre le classement complet et la Coupe.',w_mkt:'Offres de clubs en attente de votre réponse et état de vos crédits. Le bouton › ouvre le marché des transferts et des prêts.',w_car:'Confiance du conseil, objectif de la saison, titres et difficulté. Le bouton › ouvre le palmarès et les succès.',w_gest:'Niveau de vos installations : stade, boutique, sponsors et staff. Le bouton › permet de les améliorer.',titu:'Les 7 joueurs sur le terrain, dans l’ordre de la formation : gardien, défenseurs, milieux, attaquants.',remp:'Les joueurs sur le banc. Touchez un remplaçant puis un titulaire pour les échanger.',stat:'Statistiques en direct du match : possession, passes, tirs, tirs cadrés et fautes.',train:'L’intensité d’entraînement fait progresser la jauge vers +1 niveau. Intensif = plus vite mais plus de fatigue ; les jeunes progressent plus vite.',moral:'Humeur du joueur. Elle monte avec les victoires et le temps de jeu, baisse avec les défaites et le banc, et influence légèrement ses performances.',contrat:'Durée restante, salaire payé à chaque match et valeur marchande. Un contrat qui se termine fait partir le joueur.',prets:'Empruntez un joueur d’un autre club pour une durée limitée (frais payés d’avance) ou prêtez un remplaçant pour toucher des frais.',palm:'Historique de vos saisons : classement final, points et vainqueur de la Coupe.',succ:'Objectifs spéciaux à débloquer au fil des saisons.',ops:'Vos 12 dernières opérations financières, avec la journée et le montant.',t_ov:'Résumé de votre club en un coup d’œil.',t_mail:'Messages du club, offres et événements.',t_tac:'Formation, consignes par ligne, consignes individuelles et usage du Fluide.',t_club:'Votre effectif, le prochain match et les réglages rapides.',t_cal:'Toutes les journées de la saison avec les scores.',t_mkt:'Recrutement, prêts, vente de joueurs et staff.',t_car:'Confiance du conseil, palmarès et succès.',t_table:'Classement du championnat et Coupe de la Ligue.',t_gest:'Stade, sponsors et boutique de produits dérivés.',t_fin:'Revenus, dépenses et courbe de trésorerie.',t_match:'Le match en direct avec terrain, commentaires et statistiques.',t_tuto:'Tutoriel complet du jeu.',modes:'Galactik League : vous dirigez un club. Galactik Cup : vous dirigez la sélection d’une planète, dans un format Coupe du monde (4 poules, puis quarts, demies et finale), composée uniquement de joueurs nés sur cette planète (quel que soit leur club). Les deux : vous gérez un club et la sélection de sa planète, et basculez de l’un à l’autre ; la fatigue et les blessures sont partagées.',
col:'Couleur principale = fond et accent de l’interface quand vous dirigez cette équipe ; couleur secondaire = accents et boutons secondaires. Le contraste du texte est ajusté automatiquement. Évitez une couleur trop proche d’une autre équipe pour la reconnaître facilement.',
df:'Facile : adversaires −2 de niveau, revenus +20 %, salaires −15 %. Difficile : adversaires +2, revenus −15 %, salaires +15 %. Fixé à la création de la partie.',car1:'Si la confiance du conseil tombe trop bas après un objectif manqué, vous êtes licencié. Une seule « dernière chance » est accordée par partie.',ord:'Consignes par ligne : Ligne haute = plus de pression au milieu mais défense plus exposée ; Passes courtes = plus de possession, Jeu direct = plus d’attaque mais moins de ballon ; Tirs lointains = plus de tirs mais moins précis, En profondeur = moins de tirs mais plus dangereux.',ind:'Consigne individuelle : Offensif = tire plus souvent mais couvre moins ; Défensif = tire peu et renforce la défense. Normal = comportement habituel.',fo:'Consigne d’usage du Fluide : Économisé = peu de déclenchements, plus fréquents en fin de match, peu de fatigue ; Modéré = équilibré ; Abondance = déclenchements fréquents mais vos joueurs se fatiguent plus vite.',evt:'Active ou désactive les événements rares inspirés de la série (descente de police, sabotages, météorites…). Ce choix est fixé à la création de la partie.',spn:'Un sponsor verse des crédits à chaque match de championnat pendant la durée du contrat (26 matchs = 1 saison). Maximum 3 sponsors ; les offres changent à chaque journée.',shp:'Investir dans la boutique augmente les ventes de maillots, écharpes, mugs et posters à chaque match. Le revenu dépend aussi de la confiance du conseil.',fin1:'Bilan de la saison : revenus et dépenses par catégorie, et courbe de votre trésorerie match après match.',form:'Disposition de vos 6 joueurs de champ devant le gardien (ex. 2-3-1 = 2 défenseurs, 3 milieux, 1 attaquant). Plus de défenseurs = plus solide ; plus d’attaquants = plus de buts mais plus de risques.',ment:'Votre état d’esprit : Défensive (ne pas encaisser), Équilibrée, Offensive (marquer). Modifie la force de votre attaque et de votre défense.',press:'Intensité avec laquelle vous récupérez le ballon. Haut = milieu plus fort, mais vos joueurs se fatiguent plus vite.',fedit:'Effet spécial de l’équipe. Choisissez une brique d’effet, puis personnalisez son nom et sa description.',lvl:'Force générale de l’équipe, de 1 à 20. Sert à générer les joueurs et à fixer les objectifs.',squad:'Votre effectif. Les 7 joueurs surlignés sont titulaires, les autres sont remplaçants. Touchez deux joueurs pour les échanger.',legend:'Colonnes : poste (GK gardien, DEF défenseur, MID milieu, ATT attaquant) · nom (★ = personnage de la série, ✦ = joueur fictif, 🩹 = blessé) · ⚽ buts · Fl = Fluide du joueur · barre = énergie · gros chiffre = niveau.',res:'Scores des autres matchs de la journée en cours.',staff:'Employés qui améliorent votre club. Chaque niveau coûte plus cher (maximum niveau 5).',sc:'Entraîneur : fait mieux progresser vos joueurs entre deux saisons.',sk:'Kiné : vos joueurs récupèrent plus d’énergie après chaque match et se blessent moins.',sa:'Analyste : donne un bonus à la force de votre attaque et de votre défense.',sy:'Centre de formation : deux jeunes talents rejoignent l’effectif à chaque fin de saison ; plus le niveau est haut, meilleurs ils sont.',stade:'Plus le stade est grand, plus la recette des matchs à domicile augmente. Elle dépend aussi du prix du billet et de la confiance du conseil.',tk:'Un billet cher rapporte plus par spectateur mais remplit moins le stade.',mkt:'Joueurs libres à recruter ; le prix dépend de leur niveau. Effectif limité à 15 joueurs. La liste se renouvelle régulièrement.',sell:'Vous pouvez vendre vos remplaçants (pas les titulaires) pour la moitié de leur valeur. Gardez au moins 11 joueurs.',next:'Votre prochain match. Cliquez sur « Jouer la journée » : les autres matchs de la journée sont joués en même temps.',fluide:'Le Fluide est le pouvoir spécial de votre équipe : il se déclenche au hasard pendant les matchs, plus souvent si vos joueurs ont un bon Fl.',conf:'Confiance du conseil d’administration (0-100 %). Elle monte avec les victoires et baisse avec les défaites.',obj:'Place à atteindre au classement en fin de saison. Objectif réussi = prime de 1500 crédits.',spons:'Crédits gagnés à chaque match grâce à un sponsor accepté par mail.',cred:'Les crédits sont l’argent du club : gagnés à chaque match (80 de droits TV, 150 par victoire, billetterie, sponsor), dépensés en transferts, staff et stade.',pts:'3 points par victoire, 1 par nul, 0 par défaite. Classement par points, puis différence de buts.',diff:'Buts marqués moins buts encaissés. Sert à départager les égalités.',j:'Nombre de matchs joués.',sub:'3 remplacements possibles pendant un match : touchez un titulaire puis un remplaçant.',cup:'Après le championnat, les 8 meilleures équipes jouent une coupe à élimination directe (tirs au but si égalité). Le vainqueur gagne 2000 crédits.',imp:'Charge votre fichier Excel (onglet « Joueurs ») pour remplacer les effectifs des équipes.',ed:'Créez vos propres équipes, joueurs et Fluides. Les changements s’appliquent à une nouvelle partie.',start:'Choisissez l’équipe que vous dirigerez. Plus son niveau est élevé, plus elle est forte, mais plus l’objectif du conseil sera exigeant.',modjson:'Texte contenant votre mod : copiez-le pour le partager, ou collez celui d’un ami puis cliquez sur « Charger ».',cal:'Tous les matchs de chaque journée. Vos matchs sont en violet ; les scores des matchs joués sont affichés.',pitch:'Terrain vu de dessus, aux couleurs de la planète du match. Les passes, tirs et arrêts affichés correspondent exactement au texte du journal. « Rejouer l’action » revoit le dernier tir au ralenti. Tout se règle dans Paramètres > Animation des matchs.',edteams:'« Éditer » modifie une équipe, « + Nouvelle équipe » en crée une.'};

const TU=[['But du jeu','Vous dirigez un club de la Ligue Galactique : composez l’équipe, choisissez la tactique, gérez l’argent et visez l’objectif fixé par le conseil. Chaque « ? » du jeu explique l’élément à côté duquel il se trouve : survolez-le (ou touchez-le sur mobile).'],['Les onglets','Club : effectif et prochain match. Tactique : formation et placement. Match : le match en direct. Cal. : calendrier et scores. ✉️ : messages du club. Marché : transferts, prêts et staff. Gestion : stade, sponsors et boutique. Finances : revenus et dépenses. Class. : classement et coupe. Aide : cette page.'],['Jouer une journée','Dans Club, cliquez sur « Jouer la journée ». Les autres rencontres sont simulées, et votre match se lance en direct dans l’onglet Match. Appuyez sur « Coup d’envoi ». Le match dure environ 2 à 3 minutes et s’arrête à la mi-temps pour vous laisser changer de tactique ou de joueurs ; vous pouvez aussi le mettre en pause à tout moment.'],['L’effectif et les joueurs','Chaque joueur a un poste (GK gardien, DEF défenseur, MID milieu, ATT attaquant), un niveau (le gros chiffre, plus il est haut mieux c’est), une énergie (la barre : elle baisse quand il joue, remonte quand il se repose) et un Fluide personnel (Fl). Un joueur placé hors de son poste perd 25 % de son niveau.'],['La tactique','Le jeu se joue à 7 : 1 gardien et 6 joueurs de champ. La formation décrit la répartition (2-3-1 = 2 défenseurs, 3 milieux, 1 attaquant). La mentalité déplace la force entre attaque et défense. Le pressing renforce le milieu mais fatigue. Dans Tactique, touchez deux joueurs pour les échanger ; un joueur en rouge est hors de son poste.'],['Le match en direct','Le terrain vu de dessus montre votre équipe en violet et l’adversaire en orange. Le commentaire décrit chaque action. Vous pouvez mettre en pause, changer la vitesse, la mentalité, et faire 3 remplacements. Les remplacements se font en touchant un titulaire puis un remplaçant.'],['Les Fluides','Chaque équipe possède un pouvoir spécial différent, décrit dans l’onglet Club. Il se déclenche au hasard pendant le match et est annoncé dans le commentaire (✨ pour une attaque, 🌀 pour une défense). Dans Tactique ou pendant le match, réglez l’usage du Fluide : Économisé, Modéré ou Abondance.'],['Calendrier et classement','Chaque équipe joue toutes les autres deux fois (aller-retour). Victoire = 3 points, nul = 1, défaite = 0. Le calendrier montre les scores des autres équipes. À la fin de la saison, cliquez sur « Nouvelle saison » dans Class..'],['Les messages (✉️)','Le club vous écrit : bienvenue, objectifs, offres de sponsors (à accepter ou refuser), blessures, réactions de la presse et du conseil, bilan de saison. Un chiffre indique les messages non lus. La messagerie fonctionne comme une boîte mail : dossiers (non lus, suivis ⭐, à traiter, corbeille), recherche, et des réponses au choix pour certains messages (conseil, service médical, presse, centre de formation).'],['Argent, transferts et staff','Les crédits servent à recruter des joueurs libres, vendre des remplaçants et améliorer le staff (entraîneur, kiné, analyste, centre de formation). Gagnez-en en jouant, en gagnant et grâce aux sponsors.'],['Le stade','Améliorer le stade augmente les places et donc la recette à domicile. Le prix du billet influence le remplissage : trop cher, le stade se vide.'],['Les blessures','Après un match, des titulaires peuvent se blesser pour plusieurs journées (🩹). Ils sont remplacés automatiquement. Un bon kiné réduit les risques.'],['La coupe','Une fois le championnat terminé, lancez la Coupe de la Ligue depuis Class. : les 8 meilleures équipes s’affrontent en élimination directe.'],['Éditeur de mods et import','Sur l’écran de départ, l’éditeur permet de créer des équipes, des joueurs et des Fluides. Dans Club, le bouton d’import charge un fichier Excel de joueurs.'],['Consignes tactiques','Dans Tactique, réglez des consignes par ligne (défense, milieu, attaque) et une consigne pour chacun de vos 7 titulaires (Normal, Offensif, Défensif). Elles changent l’équilibre entre possession, tirs et solidité.'],['Calendrier et jours sans match','Les matchs ont lieu environ une fois par semaine, avec une pause hivernale. Entre deux matchs, avancez jour par jour (▶ Jour suivant) ou jusqu’au prochain match (⏩) : profitez-en pour le mercato, la tactique, l’entraînement et les résultats des autres clubs dans l’onglet Cal. L’énergie et la progression des joueurs avancent chaque jour.'],['Carrière, difficulté et marché','L’onglet Carrière montre la confiance du conseil, le palmarès et les succès. Un objectif manqué avec une confiance très basse mène au licenciement (une dernière chance par partie). La difficulté (Facile, Normal, Difficile) se choisit à la création. Les autres clubs s’échangent aussi des joueurs : les transferts importants sont signalés par mail.'],['Fluide, origine et nausées','Chaque joueur vient d’une planète et maîtrise parfaitement (100 %) le Fluide de son origine. Son profil ⓘ indique sa compatibilité avec les 14 Fluides. Quand il change d’équipe, il peut rejeter le Fluide du nouveau club : plus l’équipe est forte, plus c’est probable. Il a alors un léger malaise (🤢) quelques matchs, puis s’approprie ce Fluide. Sous 30 % de compatibilité, le rejet est sévère : le joueur peut être incapable de jouer pendant plusieurs matchs, et jusqu’à une saison entière vers 5 %. Le marché et les prêts affichent la compatibilité (🧬) de chaque joueur avec votre Fluide, avec un filtre pour ne garder que les plus compatibles. Ne confondez pas : Fluide (pouvoir), Endurance (attribut physique) et Énergie (fraîcheur du moment).'],['Entraînement, moral et derbys','Dans le profil ⓘ d’un joueur, choisissez l’intensité d’entraînement (Repos, Normal, Intensif) et l’axe à travailler : chaque journée fait avancer la jauge vers +1 niveau (les jeunes progressent vite, les plus de 31 ans déclinent). Le moral (😀 à 😠) monte avec les victoires et le temps de jeu, baisse avec les défaites et le banc, et influence la performance : un joueur mal dans sa peau peut demander à partir. Les derbys (Snow Kids–Tigres Rouges, Snow Kids–Shadows, Lightnings–Xenons, Technodroids–Vortex de Kaldor, Pirates–Shadows) ont plus d’occasions, plus de fautes et une billetterie à +40 %.'],['Offres sur vos joueurs','Quelques fois par saison, un club propose d’acheter l’un de vos joueurs. Le joueur peut refuser de partir (titulaire heureux, club moins bon) ; s’il accepte, vous pouvez accepter l’offre, faire une contre-proposition (+20 % ou +40 %, que le club peut refuser) ou refuser. Gardez toujours au moins 11 joueurs.'],['Événements',' Des événements rares inspirés de la série peuvent survenir avant ou pendant un match : descente de police chez les Pirates (match arrêté, 1 point chacun), sabotage des Ombres, pluie de météorites, panne d’énergie, invasion de supporters, joueur disparu, offre suspecte. Ils arrivent aussi dans les matchs des autres clubs : vous êtes alors prévenu par un mail d’actualité.'],['Sauvegardes','Le bouton « Sauvegardes » (onglet Club ou écran de départ) ouvre 5 emplacements manuels et une sauvegarde automatique, mise à jour après chaque match. Sauvegarder sur un emplacement déjà utilisé demande confirmation. Les sauvegardes restent dans ce navigateur et ne fonctionnent qu’avec le mod utilisé lors de la partie.'],['Gestion et finances','L’onglet Gestion regroupe le stade (places, prix du billet), jusqu’à 3 sponsors (contrats de 10 matchs, 1 saison ou 2 saisons) et la boutique de produits dérivés (maillots, écharpes, mugs, posters) avec 5 niveaux d’investissement chacun. L’onglet Finances détaille tous vos revenus et dépenses de la saison.'],['Les prêts','Dans Marché > Prêts, empruntez un joueur d’un autre club pour 6, 12 ou 18 matchs (frais payés d’avance, salaire à votre charge). Depuis le profil ⓘ d’un remplaçant, proposez-le en prêt : vous touchez des frais. Avec une option d’achat, un joueur emprunté peut être acheté définitivement avant la fin du prêt ; vos joueurs prêtés peuvent être rachetés par le club preneur. À la fin du prêt, le joueur retourne à son club.'],['Profil et contrats','Touchez le ⓘ d’une carte pour ouvrir le profil complet : attributs détaillés, statistiques de la saison, contrat (durée, salaire par match, valeur). Les salaires sont payés après chaque match. Vous pouvez prolonger un contrat (une tentative par saison, accord non garanti) ; un joueur dont le contrat expire quitte le club en fin de saison.'],['Contenu de la série et contenu fictif','Le jeu mélange des éléments de Galactik Football et du contenu inventé pour lui. Le symbole ★ désigne un personnage de la série. Le symbole ✦ discret signale un contenu fictif : joueur, équipe (les Vortex de Kaldor, les Comètes de Vega) ou événement imaginé pour le jeu. Survolez-le pour le rappeler. Sans symbole, un nom d’équipe vient de la série ; les statistiques sont toujours une adaptation du jeu.'],['Accessibilité et confort','Dans le menu de gauche, « Texte » agrandit toute l’interface de 15 % et « Contraste » rend les textes secondaires et les bordures plus visibles. Vos choix sont retenus dans ce navigateur. Les informations importantes ne reposent jamais sur la couleur seule : chaque poste a son sigle, chaque jauge a sa valeur chiffrée au survol et un état faible est signalé en rouge ET dans l’infobulle. Les « ? » sont plus faciles à toucher sur mobile, et le clavier (Tab, Entrée) fonctionne avec un contour de focus visible.'],['Glossaire','Niveau : force d’un joueur. Énergie : forme du moment. Fl : Fluide du joueur. Crédits : argent du club. Confiance : avis du conseil. Pressing : intensité de récupération du ballon. Titulaire : joueur sur le terrain. Remplaçant : joueur sur le banc.']];
function tutoView(){const o=V.tu??0;return'<div class="card"><button class="p" onclick="tourGo(0)">🎓 Lancer la visite guidée</button></div>'+TU.concat(NBU()?[[NB,'Duel 1 contre 1 dans une arène sphérique, les soirs sans match de votre équipe. Choisissez un champion dans votre effectif. À chaque échange, l’attaquant choisit un tir (puissant, placé, courbe) et le défenseur tente de le deviner ou d’obstruer (faute autorisée). Le premier à 3 buts gagne, le perdant est éliminé du tournoi. Trois duels par tournoi.']]:[]).map(([t,b],i)=>`<div class="card" style="cursor:pointer" onclick="V.tu=${o==i?-1:i};render()"><b>${o==i?'▾':'▸'} ${i+1}. ${t}</b>${o==i?`<div style="margin-top:6px">${b}</div>`:''}</div>`).join('')}
const TOUR=[['club','Bienvenue, manager !','Cette visite rapide présente le jeu en 11 étapes. Vous pouvez la passer à tout moment. Votre mission : mener votre club à l’objectif fixé par le conseil.'],['club','Votre club','Ici, votre effectif : 7 titulaires (surlignés) et des remplaçants. Touchez deux joueurs pour les échanger. Survolez les « ? » pour obtenir des explications partout dans le jeu.'],['tac','La tactique','Choisissez la formation, la mentalité et le pressing. Le terrain montre vos joueurs à leur poste : un joueur en rouge est hors de son poste.'],['club','Lancer un match','Dans l’onglet Club, le bouton « Jouer la journée » lance votre prochain match ; les autres matchs de la journée sont simulés en même temps.'],['match','Le match en direct','Appuyez sur « Coup d’envoi ». Le match dure 2 à 3 minutes et s’arrête à la mi-temps ; vous pouvez aussi le mettre en pause pour changer la tactique ou faire jusqu’à 3 remplacements.'],['cal','Le calendrier','Retrouvez toutes les journées et les scores des autres équipes.'],['mail','Votre boîte mail','Le club vous écrit : objectifs, offres de sponsors à accepter ou refuser, blessures, réactions de la presse. Le chiffre indique les messages non lus.'],['mkt','Argent, staff et stade','Dépensez vos crédits pour recruter, améliorer le staff (entraîneur, kiné, analyste, formation) ou agrandir le stade.'],['table','Classement et coupe','Victoire = 3 points, nul = 1. À la fin de la saison, les 8 meilleures équipes jouent la Coupe de la Ligue.'],['car','Votre carrière de manager','Chaque match rapporte de l’expérience. À chaque niveau, vous gagnez un point de compétence à investir dans l’arbre de l’onglet Manager : 2 branches au choix sur 5, des bonus passifs, et des personnages qui gagnent en confiance.'],['tuto','Besoin d’aide ?','L’onglet Aide contient un tutoriel complet, et vous pouvez relancer cette visite quand vous voulez. Bon match !']];
function tourGo(i){if(i>=TOUR.length){tourEnd();return}V.tour=i;V.tab=TOUR[i][0];render()}
function tourEnd(){V.tour=null;try{localStorage.setItem('gmtour','1')}catch(e){}V.tab='ov';render()}
function tourBox(){const i=V.tour;if(i==null)return'';const t=TOUR[i][1],x=TOUR[i][2];return`<div style="height:210px"></div><div class="card" style="position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-width:560px;margin:auto;z-index:50;border:2px solid var(--ac)"><div class="mu">Visite guidée · étape ${i+1}/${TOUR.length}</div><b>${t}</b><div style="margin:6px 0">${x}</div><div class="ctl">${i?`<button onclick="tourGo(${i-1})">← Précédent</button>`:''}<button class="p" onclick="tourGo(${i+1})">${i==TOUR.length-1?'Terminer':'Suivant →'}</button><button onclick="tourEnd()">Passer la visite</button></div></div>`}
function pc(p,cls,onclk,extra){if(V.vw=='l')return prow(p,cls,onclk,extra);const col=p.p=='GK'?'#e0a526':p.p=='DEF'?'#3b8fe8':p.p=='MID'?'#2fb36b':'#e5484d';const kd=onclk[0]=='m'?(onclk[5]=='b'?'mk':onclk[5]=='l'?'lo':'sq'):onclk.startsWith('pr')?'ed':'sq',ix=onclk.split(',').pop().replace(/\D/g,'');return`<div class="pc ${cls}${p.pr?' prs':p.c?' chr':''}" onclick="${onclk}" style="border-top:4px solid ${col};position:relative"><span onclick="event.stopPropagation();prof('${kd}',${ix})" style="position:absolute;right:3px;top:0;font-size:12px">ⓘ</span><div class="o">${p.o}</div><div class="ps" style="color:${col}">${p.p}${p.c?' ★':fp(p)}</div><div class="pn${p.pr?' prn':p.c?' chn':''}">${p.n.split(' ').map((w,i,a)=>i<a.length-1?w[0]+'.':w).join(' ')}</div><div class="gp">${gg(p.e,{size:33,fs:32,c:'#2fd0c5',tt:'Endurance'})}${gg(p.f,{size:33,fs:32,c:'#b78bff',tt:'Fluide'})}</div><div class="mu">⚽${p.g}${p.nz?' 🤢':''}${p.inj?' 🩹'+p.inj:''}${p.ln?' 🔁'+p.ln.left:''}</div>${extra||''}</div>`}
function squadCards(){const t=me(),s=slots(t.form),bn=t.sq.map((_,i)=>i).filter(i=>!t.lu.includes(i));return`<div class="card"><div class="ctl" style="justify-content:space-between"><span class="mu">Titulaires</span>${vwBtn()}</div><div class="pg">${t.lu.map((i,k)=>pc(t.sq[i],(V.sel===i?'sel ':'')+(t.sq[i].p!=s[k]?'bad':''),`pick(${i})`)).join('')}</div><div class="mu" style="margin-top:8px">Remplaçants</div>${fbar()}<div class="pg">${fl(bn.map(i=>[t.sq[i],i])).map(([p,i])=>pc(p,V.sel===i?'sel':'',`pick(${i})`)).join('')}</div><div class="mu" style="margin-top:6px">Touchez un joueur puis un autre pour échanger (titulaire ↔ remplaçant). ★ = personnage de la série · <i class="fic" title="Contenu fictif, inventé pour ce jeu (absent de la série)">✦</i> = contenu fictif.</div></div>`}
function mk2(a,i){const k=a+i;if(V.mk==k||!ST.cf){V.mk=null;a=='b'?buy(i):a=='l'?borrow(i):a=='o'?takeS(i):sell(i)}else{V.mk=k;render()}}
const AT=['Vitesse','Finition','Dribble','Passe','Vision','Tacle','Physique','Détermination','Endurance'],WT={GK:[-5,5,-7,-2,0,-8,1,1,0],DEF:[-2,-5,-3,-1,-1,3,2,1,1],MID:[0,-2,1,3,3,-1,0,1,3],ATT:[3,4,2,-2,0,-5,0,1,0]},sal=p=>Math.max(2,Math.round(p.o*p.o/300));
function attrs(p){let h=0;for(const c of p.n)h=(h*31+c.charCodeAt(0))%9973;return AT.map((a,i)=>{h=(h*37+17)%9973;return Math.max(3,Math.min(20,Math.round(p.o/5+(WT[p.p]||WT.MID)[i]*.6+(h%5)-2+((p.ab||{})[i]||0))))})}
function ensure(p){if(p.age==null){let h=0;for(const c of p.n)h=(h*17+c.charCodeAt(0))%997;p.age=18+h%16;p.ct=1+h%4;p.mp=p.mp||0}if(p.ct==null)p.ct=3}
function prof(k,i){V.pf={k,i};V.pn='';render()}
function renew(i,y){const p=me().sq[i];ensure(p);const c=sal(p)*y*8;if(p.rn||p.ct+y>5||S.cash<c)return;p.rn=1;if(Math.random()<Math.max(.2,Math.min(.95,.45+S.conf/150-p.o/200))){tx('Contrats',-c);p.ct+=y;V.pn='✅ '+p.n+' prolonge de '+y+' an(s).'}else V.pn='❌ '+p.n+' refuse de prolonger.';save();render()}
function ageUp(p){const a=p.age;if(p.pt&&p.o<p.pt&&a<=26)p.o=Math.min(p.pt,p.o+1+(a<=22&&Math.random()<.6?1:0)+(Math.random()<.3?1:0));if(a<30){if(Math.random()<Math.min(.6,.2+(a-18)*.04))p.o=Math.min(95,p.o+1)}else if(a>30&&Math.random()<Math.min(.25,.08+(a-31)*.02))p.o=Math.max(40,p.o-1)}function contracts(){S.teams.forEach((t,ti)=>{t.sq.forEach(p=>{ensure(p);p.ct--;p.rn=0;p.rq=0;p.age++;ageUp(p)});if(ti!=S.t){t.sq.forEach(p=>{if(p.ct<=0)p.ct=1+(Math.random()*3|0)});return}const keep=t.sq.filter(p=>p.ct>0);if(keep.length<11)t.sq.filter(p=>p.ct<=0).sort((a,b)=>b.o-a.o).slice(0,11-keep.length).forEach(p=>{p.ct=1});const left=t.sq.filter(p=>p.ct<=0);if(left.length){mail('Fins de contrat',left.map(p=>p.n).join(', ')+' quitte(nt) le club : contrat terminé.');left.forEach(p=>rmP(t,p))}const last=t.sq.filter(p=>p.ct==1);if(last.length)mail('Contrats à renouveler','Dernier an de contrat : '+last.map(p=>p.n).join(', ')+'. Ouvrez leur profil (ⓘ) pour négocier.')})}
function profBoxOld(){const f=V.pf;if(!f)return'';const p=f.k=='sq'?me().sq[f.i]:f.k=='mk'?S.mkt[f.i]:f.k=='lo'?lop(f.i):V.ep[f.i];if(!p)return'';ensure(p);const at=attrs(p);return`<div style="position:fixed;inset:0;background:#0008;z-index:60;display:flex;align-items:center;justify-content:center;padding:12px" onclick="V.pf=null;render()"><div class="card" style="max-width:420px;width:100%;max-height:90vh;overflow:auto" onclick="event.stopPropagation()"><div class="ctl" style="justify-content:space-between"><b style="font-size:17px">${p.c?'★ ':''}${p.n}${fp(p)}</b><b style="font-size:26px">${p.o}</b></div><div class="mu">${p.p} · ${p.age} ans · Puissance de Fluide ${p.f}${p.inj?' · 🩹 blessé '+p.inj+' j.':''}</div>${at.map((v,i)=>`<div class="ctl" style="gap:6px"><span class="mu" style="width:92px">${p.p=='GK'&&i==1?'Réflexes':AT[i]}</span><span class="bar" style="flex:1;width:auto"><i style="width:${v*5}%"></i></span><b style="width:22px;text-align:right">${v}</b></div>`).join('')}${fluSec(p,f.k=='ed'?null:me())}<h2>Saison</h2><div class="mu">Matchs : ${p.mp||0} · Buts : ${p.g||0} · Énergie : ${Math.round(p.e??100)}%</div><div class="mu">Moral : ${moralIco(p.mo)} ${Math.round(p.mo??60)} %</div><h2>Contrat</h2><div>Durée restante : <b>${p.ct} an(s)</b> · Salaire : <b>${sal(p)}</b>/match · Valeur : <b>${price(p)}</b></div>`+(f.k=='sq'?`<div class="ctl" style="margin-top:8px">${[1,2,3].map(y=>`<button ${p.rn||p.ct+y>5||S.cash<sal(p)*y*8?'disabled':''} onclick="renew(${f.i},${y})">+${y} an${y>1?'s':''} (${sal(p)*y*8})</button>`).join('')}</div><div class="mu">${p.rn?'Négociation déjà tentée cette saison.':'Une tentative par saison ; accord non garanti, le coût n’est payé qu’en cas d’accord.'}</div>`:'')+(f.k=='sq'?trainSec(p,f.i)+loanSec(p,f.i):'')+(V.pn?`<div style="margin-top:6px"><b>${V.pn}</b></div>`:'')+`<div class="ctl" style="margin-top:10px"><button class="p" onclick="V.pf=null;V.pn='';render()">Fermer</button></div></div></div>`}
function fl(a){const f=V.fl||{p:'',q:'',s:'o'};return a.filter(([p])=>(!f.p||p.p==f.p)&&(!f.c||!S||compat(p,me().name)>=f.c)&&(!f.q||p.n.toLowerCase().includes(f.q.toLowerCase()))).sort((x,y)=>f.s=='n'?x[0].n.localeCompare(y[0].n):f.s=='c'&&S?compat(y[0],me().name)-compat(x[0],me().name):f.s=='e'?(y[0].e??100)-(x[0].e??100):y[0].o-x[0].o)}
function fbar(){const f=V.fl||(V.fl={p:'',q:'',s:'o'});return`<div class="ctl" style="margin:6px 0"><select onchange="V.fl.p=this.value;render()">${['','GK','DEF','MID','ATT'].map(x=>`<option value="${x}" ${f.p==x?'selected':''}>${x||'Tous postes'}</option>`).join('')}</select><select onchange="V.fl.s=this.value;render()">${[['o','Niveau'],['n','Nom'],['e','Énergie'],['c','Compatibilité']].map(([k,l])=>`<option value="${k}" ${f.s==k?'selected':''}>Tri : ${l}</option>`).join('')}</select><select onchange="V.fl.c=+this.value;render()">${[[0,'Compat. : toutes'],[30,'Fluide ≥ 30 %'],[50,'Fluide ≥ 50 %'],[70,'Fluide ≥ 70 %']].map(([k,l])=>`<option value="${k}" ${(f.c||0)==k?'selected':''}>${l}</option>`).join('')}</select><input placeholder="🔍 Nom" value="${f.q}" oninput="V.fl.q=this.value" onchange="render()" style="width:110px"></div>`}
const vwBtn=()=>`<button onclick="vw()" style="padding:2px 8px">${V.vw=='l'?'▦ Cartes':'☰ Liste'}</button>`;

function prow(p,cls,onclk,extra){const kd=onclk[0]=='m'?(onclk[5]=='b'?'mk':onclk[5]=='l'?'lo':'sq'):onclk.startsWith('pr')?'ed':'sq',ix=onclk.split(',').pop().replace(/\D/g,'');return`<div class="row ${cls}${p.pr?' prs':p.c?' chr':''}" onclick="${onclk}" style="cursor:pointer"><span class="pos">${p.p}</span><span class="nm">${p.c?'★ ':''}<span class="${p.pr?'prn':p.c?'chn':''}">${p.n}</span>${fp(p)}${p.nz?' 🤢':''}${p.inj?' 🩹'+p.inj:''}${p.ln?' 🔁'+p.ln.left:''}</span><span class="mu">Fl ${p.f} · ⚽${p.g||0}</span><span class="bar"><i style="width:${p.e??100}%"></i></span><b>${p.o}</b>${extra||''}<span onclick="event.stopPropagation();prof('${kd}',${ix})">ⓘ</span></div>`}
